name: Determinism Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean workspace
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -ffd
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code

      - name: Verify Observatory boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 .surface/vendor/scripts/validate_host.py surface.host.json
          python3 -m py_compile .surface/vendor/scripts/project_host.py
          node --check assets/observatory-webgl-runtime.js
          node scripts/check-observatory-attestation.mjs
          node scripts/check-observatory-runtime-boot.mjs
          node scripts/check-observatory-terminal-machine.mjs

      - name: Build artifact twice and compare digests
        shell: bash
        run: |
          set -euo pipefail

          make_dist() {
            out="$1"
            rm -rf "$out"
            mkdir -p "$out"
            cp index.html "$out/index.html"
            cp 404.html "$out/404.html"
            cp public/CNAME "$out/CNAME"
            cp -R assets "$out/assets"
            cp -R data "$out/data"

            test -f "$out/index.html"
            test -f "$out/404.html"
            test -f "$out/CNAME"
            test -f "$out/assets/surface.css"
            test -f "$out/assets/observatory-webgl-runtime.js"
            test -f "$out/assets/observatory-render-gate.js"
            test -f "$out/data/verifrax-observatory.json"
            test -f "$out/data/projection-attestation.json"

            grep -Fx "www.verifrax.net" "$out/CNAME"
            grep -q "observatory-render-gate" "$out/index.html"
            grep -q "assets/observatory-render-gate.js" "$out/index.html"
            grep -q "assets/observatory-webgl-runtime.js" "$out/index.html"
            grep -q "VCO_TERMINAL_INTERACTION_COMMAND_MACHINE" "$out/assets/observatory-webgl-runtime.js"
            grep -q "FULL_OBSERVATORY" "$out/assets/observatory-webgl-runtime.js"
            grep -q "panel_containment_css" "$out/assets/surface.css"
            grep -q "DERIVED_PROJECTION" "$out/data/verifrax-observatory.json"
          }

          hash_tree() {
            root="$1"
            (
              cd "$root"
              find . -type f -print0 \
                | sort -z \
                | xargs -0 sha256sum \
                | sha256sum \
                | awk '{print $1}'
            )
          }

          A="$(mktemp -d)/dist"
          B="$(mktemp -d)/dist"

          make_dist "$A"
          make_dist "$B"

          HASH_A="$(hash_tree "$A")"
          HASH_B="$(hash_tree "$B")"

          echo "HASH_A=$HASH_A"
          echo "HASH_B=$HASH_B"

          test "$HASH_A" = "$HASH_B"
          diff -ru "$A" "$B"

      - name: Verify clean workspace after deterministic build
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code
