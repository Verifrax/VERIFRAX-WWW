name: Determinism Check

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hard clean
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -ffd

      - name: Verify clean workspace
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code

      - name: Build artifact twice and compare digests
        shell: bash
        run: |
          set -euo pipefail

          build_once() {
            out="$1"
            rm -rf "$out/dist"
            mkdir -p "$out/dist"

            cp index.html "$out/dist/index.html"
            cp 404.html "$out/dist/404.html"
            cp public/CNAME "$out/dist/CNAME"
            cp -R assets "$out/dist/assets"
            cp -R data "$out/dist/data"

            test -f "$out/dist/index.html"
            test -f "$out/dist/404.html"
            test -f "$out/dist/CNAME"
            test -f "$out/dist/assets/surface.css"
            test -f "$out/dist/assets/observatory-render-gate.js"
            test -f "$out/dist/assets/observatory-webgl-runtime.js"
            test -f "$out/dist/data/verifrax-observatory.json"
            test -f "$out/dist/data/projection-receipt.json"
            test -f "$out/dist/data/projection-ledger.json"
            test -f "$out/dist/data/projection-attestation.json"
            test -f "$out/dist/data/projection-public-key.json"

            grep -Fx "www.verifrax.net" "$out/dist/CNAME"
            grep -q "observatory-render-gate" "$out/dist/index.html"
            grep -q "assets/observatory-render-gate.js" "$out/dist/index.html"
            grep -q "DERIVED_PROJECTION" "$out/dist/data/verifrax-observatory.json"
            grep -q "NOT_TRUTH_SOURCE" "$out/dist/data/verifrax-observatory.json"
            grep -q "FULL_OBSERVATORY" "$out/dist/data/projection-receipt.json"
            grep -q "FULL_OBSERVATORY" "$out/dist/data/projection-attestation.json"
          }

          tree_hash() {
            root="$1"
            (
              cd "$root"
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) | sha256sum | awk "{print \$1}"
          }

          A="$(mktemp -d)"
          B="$(mktemp -d)"

          build_once "$A"
          build_once "$B"

          HASH_A="$(tree_hash "$A/dist")"
          HASH_B="$(tree_hash "$B/dist")"

          echo "HASH_A=$HASH_A"
          echo "HASH_B=$HASH_B"

          test "$HASH_A" = "$HASH_B"
          diff -ru "$A/dist" "$B/dist"

      - name: Verify clean workspace after build
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code
