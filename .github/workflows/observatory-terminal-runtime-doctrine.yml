name: Observatory Terminal Runtime Doctrine

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  terminal-runtime-doctrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify terminal runtime doctrine in browser
        run: npm run check:observatory-terminal-runtime-doctrine
