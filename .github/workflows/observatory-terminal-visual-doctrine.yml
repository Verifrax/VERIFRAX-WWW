name: Observatory Terminal Visual Doctrine

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  terminal-visual-doctrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify terminal visual doctrine invariant
        run: npm run check:observatory-terminal-visual-doctrine
