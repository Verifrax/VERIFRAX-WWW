name: Observatory Visual Truth

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproject committed surface
        run: |
          python3 .surface/vendor/scripts/project_host.py
          python3 .surface/vendor/scripts/project_host.py
      - name: Assert projection idempotency
        run: git diff --exit-code -- . ':!README.md'
      - name: Install browser visual audit deps outside repository
        shell: bash
        run: |
          set -euo pipefail
          PW=/tmp/vco-visual-truth
          npm install --prefix "$PW" playwright pngjs
          "$PW/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run visual truth anti-fake audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 >/tmp/verifrax-www-visual-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/vco-visual-truth/node_modules node scripts/check-observatory-visual-truth.cjs http://127.0.0.1:4174/
