name: verifrax-org36-public-surface-authority-witness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifrax-org36-public-surface-authority-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-verifrax-org36-public-surface-authority-witness.cjs
