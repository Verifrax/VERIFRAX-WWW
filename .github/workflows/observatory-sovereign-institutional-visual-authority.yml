name: Observatory Sovereign Institutional Visual Authority

on:
  pull_request:
  push:
    branches:
      - main
      - midiakiasat/sovereign-institutional-visual-authority

jobs:
  sovereign-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser deps outside repo
        run: |
          set -euo pipefail
          mkdir -p /tmp/vco-sovereign-visual
          cd /tmp/vco-sovereign-visual
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright pngjs >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify sovereign institutional visual authority
        run: |
          set -euo pipefail
          python3 -m http.server 4197 >/tmp/verifrax-www-sovereign-visual-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          sleep 2
          NODE_PATH=/tmp/vco-sovereign-visual/node_modules node scripts/check-observatory-sovereign-institutional-visual-authority.cjs http://127.0.0.1:4197/
